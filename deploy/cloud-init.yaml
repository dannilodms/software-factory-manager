#cloud-config
#
# Prepares every server of the system. The tool in apps/api/tools/environment
# reads this file when it turns an environment on: it writes the host key it
# generated and the deploy public key in the places marked for them, as a
# template of Go's text/template, and hands the result to the provider as the
# user data of the new server. Nothing on a
# server is set only by hand: a change made there is written here too. Rules:
# Servers in Environments of CODING_STANDARDS.md.
#
# Docker comes from Docker's own repository, at the versions under
# `packages`. Each version is built for one release of Ubuntu, the system
# image that the choices of an environment name (deploy/server.*.yaml): the
# tests of the tool fail when the two differ, so both change together.
#
# Docker publishes the port of a container past ufw, through rules of its own
# in iptables: the firewall below holds only for what runs on the server
# itself. The Compose file of a server publishes the ports of Caddy, 80 and
# 443, and nothing else.

# The host key the tool generated, so that the tool, the pipeline and the
# maintainer know it before the first connection. The keys of the image are
# deleted. cloud-init makes a key only of a type whose key is missing, so the
# one type below, which its schema requires, keeps the given key. The upgrade
# of openssh-server at the first boot makes the other types again: runcmd
# deletes them, and sshd offers only this one.
ssh_deletekeys: true
ssh_genkeytypes: [ed25519]
ssh_keys:
  ed25519_private: |
    {{ indent 4 .HostPrivateKey.Reveal }}
  ed25519_public: "{{ .HostPublicKey }}"

# SSH by key only, as the deploy user: no password, and no root.
ssh_pwauth: false
disable_root: true
users:
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "{{ .DeployPublicKey }}"

write_files:
  # Read before 50-cloud-init.conf, so these values win: the first one sshd
  # reads for a setting is the one it keeps.
  - path: /etc/ssh/sshd_config.d/10-server.conf
    permissions: "0644"
    content: |
      HostKey /etc/ssh/ssh_host_ed25519_key
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowUsers deploy
  # Automatic security updates: unattended-upgrades installs, every day, the
  # updates of Ubuntu's security pocket, and nothing from Docker's
  # repository, which keeps Docker at the versions below.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  # A package brings only what it depends on, so that installing Docker adds
  # no package of Docker's at a version this file does not name.
  - path: /etc/apt/apt.conf.d/90-no-recommends
    permissions: "0644"
    content: |
      APT::Install-Recommends "false";
  # The metadata service of the provider, at 169.254.169.254, serves the user
  # data of the server, which holds the private host key, to whatever asks
  # from the server. The server itself asks it; a container never does.
  # Docker sends what a container sends out through the chain DOCKER-USER,
  # which it creates when it is missing and never changes, so the rule there
  # holds. The unit puts it there on every boot, after ufw has loaded its
  # rules and before Docker starts, and Docker starts no container without
  # it.
  - path: /etc/systemd/system/containers-without-metadata.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Keep every container from the metadata service of the provider
      After=ufw.service
      Before=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=-/usr/sbin/iptables -N DOCKER-USER
      ExecStart=/usr/sbin/iptables -I DOCKER-USER -d 169.254.169.254/32 -j DROP

      [Install]
      RequiredBy=docker.service

