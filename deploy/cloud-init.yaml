package_update: true
package_upgrade: true
packages:
  - ufw
  - unattended-upgrades
  # Docker Engine, its command line and Compose, at the versions read on
  # https://download.docker.com/linux/ubuntu/dists/resolute/stable/ on
  # 2026-11-19.
  - [containerd.io, "2.4.2-4~ubuntu.26.04~resolute"]
  - [docker-ce-cli, "5:29.10.0-1~ubuntu.26.04~resolute"]
  - [docker-ce, "5:29.10.0-1~ubuntu.26.04~resolute"]
  - [docker-compose-plugin, "5.8.0-1~ubuntu.26.04~resolute"]

# One shell script, which stops at the first command that fails, so that
# cloud-init reports the failure and the last line, the signal that the
# server is prepared, is never written.
runcmd:
  - set -eu
  # cloud-init only warns when this file breaks its schema, and goes on with
  # what it understood. Checked here, a broken file stops the script before
  # the signal, and the tool destroys the server. The configuration of the
  # provider is not checked, so that a deprecation there fails nothing.
  - cloud-init schema --config-file /var/lib/cloud/instance/cloud-config.txt
  - usermod --append --groups docker deploy
  # The firewall inside the server: 22, 80 and 443 in, everything out. SSH is
  # let in before the firewall starts.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  # No container reaches the metadata service: Docker started when it was
  # installed, and the unit is enabled for every boot after this one.
  - systemctl daemon-reload
  - systemctl enable --now containers-without-metadata.service
  - rm -f /etc/ssh/ssh_host_rsa_key /etc/ssh/ssh_host_rsa_key.pub /etc/ssh/ssh_host_ecdsa_key /etc/ssh/ssh_host_ecdsa_key.pub
  - sshd -t
  - systemctl try-restart ssh.service
  - docker version
  - docker compose version
  # The signal that the server is prepared, which the tool waits for.
  - mkdir -p /var/lib/software-factory-manager
  - touch /var/lib/software-factory-manager/server-prepared

final_message: "The server is prepared, after $UPTIME seconds."
